<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#15231f">
	<title>Portraits from my jungle</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>

<body>
	<main class="jungle" id="jungle">
		<div class="canopy" aria-hidden="true"></div>
		<header class="masthead">
			<p class="eyebrow">A curious collection</p>
			<h1>Portraits from<br>my jungle</h1>
		</header>
		<button class="gallery-open" id="gallery-open" type="button">
			<span aria-hidden="true">&#9638;</span>
			<span>View contact sheets</span>
		</button>

		<div class="scene" id="scene" aria-hidden="true">
			<div class="portrait-scatter" id="portrait-scatter"></div>
		</div>
		<p class="animal-count" id="animal-count" aria-live="polite">16 portraits</p>
		<p class="status-message" id="status-message" role="status" hidden></p>

		<div class="welcome" id="welcome">
			<button class="start-button" id="start-button" type="button">
				<span class="play-mark" aria-hidden="true">&#9654;</span>
				<span>Enter the jungle</span>
			</button>
		</div>

		<nav class="controls" aria-label="Playback controls" hidden>
			<button class="control-button" id="pause-button" type="button" aria-pressed="false">Pause</button>
			<label class="volume-control">
				<span>Ambient</span>
				<input id="ambient-volume" type="range" min="0" max="1" step="0.01" value="1">
				<output id="ambient-volume-value" for="ambient-volume">100%</output>
			</label>
			<label class="volume-control">
				<span>Animals</span>
				<input id="animal-volume" type="range" min="0" max="1" step="0.01" value="1">
				<output id="animal-volume-value" for="animal-volume">100%</output>
			</label>
		</nav>
		<div class="horizon" aria-hidden="true"></div>
	</main>
	<dialog class="gallery-dialog" id="gallery-dialog" aria-labelledby="gallery-title">
		<div class="gallery-shell">
			<header class="gallery-header">
				<div>
					<p class="eyebrow">Image archive</p>
					<h2 id="gallery-title">Contact sheets</h2>
				</div>
				<button class="gallery-close" id="gallery-close" type="button"
					aria-label="Close gallery">&#10005;</button>
			</header>
			<div class="gallery-image-wrap">
				<img class="gallery-image" id="gallery-image" src="../images/contact_sheet_1.jpg"
					alt="Contact sheet 1 of 3">
			</div>
			<footer class="gallery-footer">
				<p class="gallery-position" id="gallery-position" aria-live="polite">1 / 3</p>
				<nav class="gallery-navigation" aria-label="Contact sheet navigation">
					<button class="gallery-step" id="gallery-previous" type="button"
						aria-label="Previous contact sheet">&#8592; Previous</button>
					<button class="gallery-step" id="gallery-next" type="button" aria-label="Next contact sheet">Next
						&#8594;</button>
				</nav>
			</footer>
		</div>
	</dialog>
</body>

</html>
